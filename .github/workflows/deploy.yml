name: Test, audit and deploy to GitHub Pages

# On every push to main: build and run every check and test, run the release audit (Lighthouse accessibility,
# axe, first-load time, installability, computer reply time and cube frame times), and only if both pass
# publish build-subpath/ (the app under /ultimattt/) to GitHub Pages. The constitution requires the audit to pass before any deploy.
# One-time setup: in the repository's Settings > Pages, set Source to "GitHub Actions", and turn on "Enforce HTTPS".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/build.mjs --subpath
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:contract
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build-subpath

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # builds the app, then Lighthouse, axe, installability and the timing tests
      - run: npm run audit

  deploy:
    needs: [test, audit]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
